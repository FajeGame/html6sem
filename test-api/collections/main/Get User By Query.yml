info:
  name: Get User By Query
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/greeting?id={{savedUserId}}"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: id
      value: "{{savedUserId}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const userId = bru.getEnvVar("savedUserId");
        if (!userId) {
            console.error("No savedUserId found! Run Create User first.");
    - type: after-response
      code: |-
        const response = res.getBody();
        const jsonResponse = typeof response === 'string' ? JSON.parse(response) : response;

        console.log("User data:", jsonResponse);

        // Простая проверка (можно расширить)
        if (jsonResponse.name === "Ivan" && jsonResponse.surname === "Ivanov") {
            console.log("✅ User data verified");
        } else {
            console.error("❌ User data mismatch");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
