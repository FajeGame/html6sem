info:
  name: Get Greeting
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/greeting"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();
        console.log(response);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
